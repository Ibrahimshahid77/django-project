<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 p-3" style= "background-color: rgb(170, 177, 182);max-width: 500px; border-radius: 20px;">
  <h2 class="mb-4">Change Password</h2>


  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Current Password</label>
      <input type="password" name="current_password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="new_password" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" name="confirm_password" class="form-control" required>
    </div>
    {% for message in messages %}
    <div class="alert alert-warning alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
    <button type="submit" class="btn btn-primary mb-2">Change Password</button>
    <a href="{% url 'home-page' %}" class="btn btn-secondary mb-2" style = "margin-left : 241px";>Cancel</a>

  </form>
</div>
</body>
</html>
