<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to bottom right, #2e4b68, #2f465c, #3c546d); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;">

  <div style="background-color: white; border-radius: 20px; padding: 40px 50px; box-shadow: 0 0 30px rgba(0,0,0,0.6); width: 600px;">
    <h2 style="text-align: center; color: #1a237e; font-size: 2rem; margin-bottom: 30px;">Change Password</h2>

    <form method="post">
      {% csrf_token %}

      <div style="margin-bottom: 20px;">
        <input type="password" name="current_password" placeholder="Current Password" class="form-control" style="height: 50px; border-radius: 25px; padding-left: 20px;" required>
      </div>

      <div style="margin-bottom: 20px;">
        <input type="password" name="new_password" placeholder="New Password" class="form-control" style="height: 50px; border-radius: 25px; padding-left: 20px;" required>
      </div>

      <div style="margin-bottom: 20px;">
        <input type="password" name="confirm_password" placeholder="Confirm New Password" class="form-control" style="height: 50px; border-radius: 25px; padding-left: 20px;" required>
      </div>

      {% for message in messages %}
        <div class="alert alert-warning alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}

      <button type="submit"
        style="width: 100%; height: 45px; border-radius: 25px; font-weight: bold; background-color: #5e35b1; color: white; border: none; margin-bottom: 15px;">
        Change Password</button>

      <a href="{% url 'home-page' %}" 
        style="display: inline-block; text-align: center; width: 100%; height: 45px; line-height: 45px; border-radius: 25px; font-weight: bold; background-color: #eeeeee; color: #333; text-decoration: none;">
        Cancel
      </a>
    </form>
  </div>

</body>
</html>
