<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to bottom right, #2c3e50, #34495e); height: 100vh; margin: 0; padding: 0;">

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="shadow-lg" style="background-color: white; border-radius: 20px; padding: 40px 50px; width: 750px;">
      <h2 style="text-align: center; color: #1a237e; margin-bottom: 25px;">Create Your Profile</h2>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;padding-left: 20px;  border: 1px solid #ccc ;">
          <label style="font-weight: bold;">Name</label>
          <input type="text" value="{{ request.user.username }}" disabled class="form-control" style="height: 45px; border-radius: 10px;">
        </div>

        <div style="margin-bottom: 20px;padding-left: 20px; border: 1px solid #ccc;">
          <label style="font-weight: bold;">Email</label>
          <input type="email" value="{{ request.user.email }}" disabled class="form-control" style="height: 45px; border-radius: 10px;">
        </div>

        <div style="margin-bottom: 20px;padding-left: 20px; border: 1px solid #ccc;">
          <label style="font-weight: bold;">Skills</label>
          <input type="text" name="skills" class="form-control" style="height: 45px; border-radius: 10px;">
        </div>

        <div style="margin-bottom: 20px;padding-left: 20px; border: 1px solid #ccc;">
          <label style="font-weight: bold;">About</label>
          <textarea name="about" class="form-control" rows="4" style="border-radius: 10px;"></textarea>
        </div>

        <div style="margin-bottom: 20px;padding: 20px; border: 1px solid #ccc;">
          <label style="font-weight: bold;">Profile Picture</label>
          <input type="file" name="profile_picture" class="form-control" style="height: 45px; border-radius: 10px;">
        </div>

        <h4 style="color: #2e86de; margin-top: 30px;">Projects</h4>

        <button type="button" class="btn btn-outline-primary mb-3" data-bs-toggle="modal" data-bs-target="#projectModal">+ Add Project</button>

        <div class="d-flex justify-content-center">
          <button type="submit" class="btn  btn-lg w-100" style="border-radius: 12px;background-color: #5e35b1; color: #ccc;">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="projectModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form method="POST" action="{% url 'add_project' %}" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="modal-header">
            <h5 class="modal-title">Add Project</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="text" name="project_name" placeholder="Name" class="form-control mb-3" required>
            <input type="url" name="project_url" placeholder="URL" class="form-control mb-3">
            <textarea name="project_des" placeholder="Description" class="form-control mb-3" rows="2" required></textarea>
            <input type="text" name="project_stack" placeholder="Stack" class="form-control mb-3">
            <input type="file" name="project_photo" class="form-control mb-3">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-success" type="submit">Save Project</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script>
document.addEventListener('DOMContentLoaded', function () {
  const projectForm = document.querySelector('#projectModal form');

  projectForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const formData = new FormData(projectForm);

    fetch("{% url 'add_project' %}", {
      method: 'POST',
      body: formData,
      headers: {
        'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
      },
    })
    .then(response => {
      if (!response.ok) throw new Error('Failed to save project');
      return response.text();
    })
    .then(data => {
      const modal = bootstrap.Modal.getInstance(document.getElementById('projectModal'));
      modal.hide();

      const successAlert = document.getElementById('success-alert');
      successAlert.classList.remove('d-none');

      setTimeout(() => {
        successAlert.classList.add('d-none');
      }, 3000);

      projectForm.reset();
    })
    .catch(error => {
      alert("Something went wrong: " + error.message);
    });
  });
});
</script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
