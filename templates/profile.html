<h1 style="color: green;">Huah ✅</h1>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .project-block {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #f9f9f9;
    }
  </style>
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h2 class="mb-4 text-center">Create your profile</h2>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" value="{{ request.user.username }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ request.user.email }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Skills</label>
        <input type="text" name="skills" class="form-control" >
      </div>

      <div class="mb-3">
        <label class="form-label">About</label>
        <textarea name="about" class="form-control" rows="4"></textarea>
      </div>

   
      <h4 class="mt-4">Projects</h4>
      <div id="project-fields"></div>
      <button type="button" class="btn btn-outline-secondary mb-3" onclick="addProject()"> Add Project</button>

      <div class="d-flex justify-content-between">
       
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </div>
    </form>
  </div>
</div>

<script>
function addProject() {
  const container = document.getElementById('project-fields');
  container.insertAdjacentHTML('beforeend', `
    <div class="project-block">
      <div class="mb-3">
        <label class="form-label">Project Name</label>
        <input type="text" name="project_name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Project URL</label>
        <input type="url" name="project_url" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="project_des" class="form-control" rows="2" required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Stack</label>
        <input type="text" name="project_stack" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Project Photo</label>
        <input type="file" name="project_photo" class="form-control">
      </div>
    </div>
  `);
}
</script>

</body>
</html>
