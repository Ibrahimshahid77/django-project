<body style="background: linear-gradient(to bottom right, #2e4b68, #2f465c,#3c546d ); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center;">

  <div style="background-color: white; border-radius: 20px; padding: 40px 50px; box-shadow: 0 0 30px rgba(0,0,0,0.6); width: 600px;">
    <h2 style="text-align: center; color: #1a237e; font-size: 2rem; margin-bottom: 30px;">Sign up</h2>
    <form method="POST" action="/signup/">
      {% csrf_token %}
      <div style="margin-bottom: 20px;">
        <input type="email" name="email" placeholder="Email" required
          style="width: 100%; height: 50px; font-size: 16px; border-radius: 25px; padding-left: 20px; border: 1px solid #ccc;">
      </div>
      <div style="margin-bottom: 20px;">
        <input type="text" name="username" placeholder="Username" required
          style="width: 100%; height: 50px; font-size: 16px; border-radius: 25px; padding-left: 20px; border: 1px solid #ccc;">
      </div>

      <div style="margin-bottom: 20px;">
        <input type="password" name="password" placeholder="Password" required
          style="width: 100%; height: 50px; font-size: 16px; border-radius: 25px; padding-left: 20px; border: 1px solid #ccc;">
      </div>

      {% if error %}
        <div style="color: red;">{{ error }}</div>
      {% endif %}

      <button type="submit"
        style="width: 100%; height: 45px; border-radius: 25px; font-weight: bold; background-color: #5e35b1; color: white; border: none; margin-bottom: 15px;">
        Sign up
      </button>

      <a href="{% url 'login' %}" 
       style="display: inline-block; text-align: center; width: 100%; height: 45px; line-height: 45px; border-radius: 25px; font-weight: bold; background-color: #eeeeee; color: #333; text-decoration: none;">Already have an account</a>
    </form>
  </div>
</body>
